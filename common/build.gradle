architectury {
    common(rootProject.platforms.split(","))
}

dependencies {
    // Only used for the @Environment annotations; don't use other Fabric Loader classes in common.
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "dev.architectury:architectury:${rootProject.architectury_api_version}"

    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

repositories {
    mavenCentral()
}

test {
    useJUnitPlatform()
}
