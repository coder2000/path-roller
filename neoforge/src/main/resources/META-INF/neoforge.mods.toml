modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "pathroller"
version = "${version}"
displayName = "Path Roller"
authors = "Dieter Lunn"
description = '''
A roller that paves dirt paths as you walk, in any of eight directions and at a width you choose.
'''
logoFile = "assets/pathroller/icon.png"

[[dependencies.pathroller]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.pathroller]]
modId = "architectury"
type = "required"
versionRange = "[${architectury_api_version},)"
ordering = "AFTER"
side = "BOTH"
